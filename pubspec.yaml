name: erbilcafe
description: Discover cafés in Erbil — menus, maps, reviews and table bookings.
publish_to: "none"

# 2.0.0 marks the rebuild onto a real backend. The 1.x line was a UI-only prototype.
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & dependency injection
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  equatable: ^2.1.0

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.0

  # Models & serialisation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Maps & location
  google_maps_flutter: ^2.13.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  lottie: ^3.1.3
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.0
  intl: ^0.20.2

  # Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.11.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true # builds the l10n delegates from lib/l10n/*.arb

  assets:
    - assets/img/
    - assets/lottie/
    - assets/icon/
    - assets/icons/
    - assets/images/
    - assets/markers/
    - assets/Coffee/

  fonts:
    # Primary UI face, carried over from v1.
    - family: RalewaySemi
      fonts:
        - asset: assets/fonts/RalewaySemi.ttf
    # Covers Kurdish Sorani and Arabic script.
    - family: Kurdish
      fonts:
        - asset: assets/fonts/kurdish.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#141921"
  image: assets/splash/cafe.png
  android: true
  ios: true
  android_12:
    color: "#141921"
    image: assets/splash/cafe.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/playstore.png
  image_path_ios: assets/icon/appstore.png
  remove_alpha_ios: true
